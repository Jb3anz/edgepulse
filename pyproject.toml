[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgepulse"
version = "0.1.0"
description = "Lightweight, fault-tolerant system telemetry agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["psutil>=5.9", "platformdirs>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
edgepulse = "client.main:main"

[tool.setuptools.packages.find]
include = ["client*"]
